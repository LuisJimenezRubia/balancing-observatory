version: 2

models:
  - name: stg_fx_rate
    description: ECB euro reference rate per currency and business day (currency units per euro).
    tests:
      - unique_combination: {arguments: {columns: [currency, rate_date]}}
    columns:
      - name: units_per_eur
        tests: [not_null]
  - name: stg_imbalance_price
    description: >
      Imbalance price per area and quarter-hour in EUR/MWh, surplus and deficit sides as columns. Coarser source
      resolutions are spread over their quarter-hours; CZK prices are converted with the ECB reference rate.
    tests:
      - unique_combination: {arguments: {columns: [area, interval_start_utc]}}
    columns:
      - name: area
        tests: [not_null, {relationships: {arguments: {to: ref('areas'), field: area}}}]
      - name: source_resolution
        tests: [{accepted_values: {arguments: {values: [PT15M, PT30M, PT60M]}}}]
      - name: source_currency
        tests: [{accepted_values: {arguments: {values: [EUR, CZK]}}}]
  - name: stg_imbalance_volume
    description: >
      Signed system imbalance per control area and quarter-hour in MWh (positive = system long, negative = system
      short). Coarser source resolutions are split evenly over their quarter-hours.
    tests:
      - unique_combination: {arguments: {columns: [area, interval_start_utc]}}
    columns:
      - name: area
        tests: [not_null, {relationships: {arguments: {to: ref('areas'), field: area}}}]
      - name: system_imbalance_mwh
        tests: [not_null]
  - name: stg_cbmp_15min
    description: >
      aFRR cross-border marginal price (PICASSO) per price area, direction and quarter-hour, aggregated in silver
      from the 4-second optimisation cycles. Germany is taken from 50Hertz (the German control areas are identical).
    tests:
      - unique_combination: {arguments: {columns: [area, direction, interval_start_utc]}}
    columns:
      - name: direction
        tests: [not_null, {accepted_values: {arguments: {values: [up, down]}}}]
      - name: cycles_total
        tests: [not_null]
  - name: stg_cbmp_convergence_15min
    description: CBMP convergence of each area with the reference area, counted per 4-second cycle in silver.
    tests:
      - unique_combination: {arguments: {columns: [area, reference_area, direction, interval_start_utc]}}
    columns:
      - name: reference_area
        tests: [not_null, {accepted_values: {arguments: {values: [DE]}}}]
  - name: stg_forecast_actual_hourly
    description: >
      Day-ahead forecast and actual value of wind, solar and load per zone, technology and hour (UTC), in MW,
      with the number of quarter-hours each side covers.
    tests:
      - unique_combination: {arguments: {columns: [area, technology, hour_start_utc]}}
    columns:
      - name: technology
        tests: [not_null, {relationships: {arguments: {to: ref('technologies'), field: technology}}}]
      - name: area
        tests: [not_null, {relationships: {arguments: {to: ref('areas'), field: area}}}]
